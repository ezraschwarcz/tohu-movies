# Checks the live site every Monday, and whenever started by hand from the
# Actions tab: accessibility (pa11y), speed and search basics (Lighthouse)
# broken links (linkinator), an attack scan (OWASP ZAP) and the database
# check (private data stays private). All open source.
name: Live site checks

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pa11y:
    name: Accessibility (pa11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes pa11y-ci@5 --config .pa11yci.json

  lighthouse:
    name: Speed, SEO, best practices (Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The report link is printed at the end of this step's log.
      - run: npx --yes @lhci/cli@0.15 autorun --config=lighthouserc.json

  links:
    name: Broken links (linkinator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes linkinator@6 --config linkinator.config.json

  database:
    name: Database locked to visitors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/db/live.test.mjs

  zap:
    name: Attack scan (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Looks at the live site the way an attacker would, without attacking
      # it: a passive scan. Fails only on serious findings; the full report
      # is attached to the run.
      - run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://www.tohumovies.com -r report.html -I -m 3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/report.html
          retention-days: 30
